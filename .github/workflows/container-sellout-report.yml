name: Container Sellout Report

on:
  schedule:
    # 16:00 UTC every Saturday = 19:00 East Africa Time (owner's choice,
    # 2026-11-02). A normal run is ~300 Zoho API calls; the full refresh
    # every 28 days is ~1,100.
    - cron: "0 16 * * 6"
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Backfill/test: treat this YYYY-MM-DD date as 'today' instead of the real current date"
        required: false
        type: string
      full_refresh:
        description: "Re-pull every lot and re-list every invoice (normally automatic every 28 days)"
        required: false
        type: boolean
        default: false
      max_api_calls:
        description: "Stop before making more than this many Zoho API calls (blank = no limit; never applies to a full refresh)"
        required: false
        type: string

permissions:
  contents: write

# The sales cache in data/ is read and rewritten by every run, so two runs
# must never overlap.
concurrency:
  group: container-sellout-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    # The first run backfills every invoice since the first container, one
    # API call per invoice. The script stops fetching at
    # SALES_FETCH_TIME_BUDGET_MINUTES, saves its progress, and still writes
    # the report (marked PARTIAL); the next run carries on from there.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      # A late-starting scheduled run must not repeat a run the backup
      # trigger (a Claude Code scheduled task at 19:10 EAT) already did.
      - name: Skip if today's report already exists
        id: guard
        run: |
          today=$(TZ=Africa/Nairobi date +%d_%m_%Y)
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "reports/Container_Sellout_${today}.xlsx" ]; then
            echo "Report for ${today} already exists; skipping this scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'

      - name: Generate Container Sellout report
        if: steps.guard.outputs.skip != 'true'
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORGANIZATION_ID: ${{ secrets.ZOHO_ORGANIZATION_ID }}
          REPORT_AS_OF_DATE: ${{ inputs.as_of_date }}
          SALES_FETCH_TIME_BUDGET_MINUTES: "300"
          FULL_REFRESH: ${{ inputs.full_refresh }}
          # Scheduled (weekly) runs are capped at 500 calls; a full refresh
          # lifts the cap inside the script.
          MAX_API_CALLS: ${{ github.event_name == 'schedule' && '500' || inputs.max_api_calls }}
        run: python -u scripts/container_sellout_report.py

      - name: Commit report and data to repo
        # Commit the sales cache even if the report step failed, so a long
        # backfill never loses the invoices it already fetched.
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/Container_Sellout_*.xlsx 2>/dev/null || true
          git add data/*.csv 2>/dev/null || true
          git add data/*.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Add Container Sellout report for $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No report changes to commit."
          fi
