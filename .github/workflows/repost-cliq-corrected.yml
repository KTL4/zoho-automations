name: Repost corrected SOH report to Cliq (throwaway)

on:
  workflow_dispatch: {}

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post corrected report to Cliq
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_CLIQ_REFRESH_TOKEN: ${{ secrets.ZOHO_CLIQ_REFRESH_TOKEN }}
        run: python -u scripts/post_to_cliq.py "reports/SOH_28_10_2026.xlsx"
