name: Item Runway Report

on:
  # Paused 2026-11-04 at the user's request. Uncomment the schedule block
  # below to resume automatic monthly runs. workflow_dispatch (manual runs)
  # still works while paused.
  # schedule:
  #   - cron: "0 3 1 * *"  # 03:00 UTC on the 1st of each month = 06:00 East Africa Time
  workflow_dispatch:
    inputs:
      as_of_date:
        description: "Backfill/test: treat this YYYY-MM-DD date as 'today' instead of the real current date"
        required: false
        type: string

permissions:
  contents: write

# data/item_runway_cache_monthly.csv is read and rewritten by every run, so
# two runs must never overlap.
concurrency:
  group: item-runway-report
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generate Item Runway report
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORGANIZATION_ID: ${{ secrets.ZOHO_ORGANIZATION_ID }}
          REPORT_AS_OF_DATE: ${{ inputs.as_of_date }}
        run: python -u scripts/item_runway_report.py

      - name: Commit report and cache to repo
        # Commit the cache even if the report step failed, so a run that
        # dies partway through never loses the invoices/credit notes it
        # already fetched.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/Sales_by_item\(???\).xlsx 2>/dev/null || true
          git add data/item_runway_cache_monthly.csv 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Add Item Runway report for $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No report changes to commit."
          fi
